<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Ded Cartoons</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <section class="room-experience" aria-label="Ded Cartoons Room">
        <div class="room-shell">
          <iframe
            id="room-frame"
            class="room-frame"
            src="./public/room/index.html"
            title="Habitación interactiva de Ded Cartoons"
            loading="lazy"
            allow="autoplay; fullscreen"
            allowfullscreen
          ></iframe>
          <button id="room-entry-gate" class="room-entry-gate" type="button" aria-label="Presioná Enter para entrar con sonido">
            <video src="./public/assets/Enter-input.mp4" autoplay muted loop playsinline preload="auto"></video>
          </button>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
